<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <!-- Open Source layer (bottom, outside dashed box) -->
  <rect x="20" y="240" width="380" height="50" rx="8" ry="8" fill="#f5f7f9" stroke="rgba(46,67,105,0.15)" stroke-width="1"/>
  <text x="210" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#2e4369">PROWIDE OPEN SOURCE</text>

  <!-- Dashed box containing SDK + modules -->
  <rect x="20" y="10" width="380" height="215" rx="8" ry="8" fill="none" stroke="#6EB7CE" stroke-width="1" stroke-dasharray="6 3" stroke-opacity="0.5"/>

  <!-- SDK layer (inside dashed box) -->
  <rect x="30" y="175" width="360" height="40" rx="6" ry="6" fill="rgba(110,183,206,0.12)" stroke="rgba(110,183,206,0.4)" stroke-width="1"/>
  <text x="210" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#6EB7CE">PROWIDE INTEGRATOR SDK</text>

  <!-- MyFormat module -->
  <rect x="30" y="20" width="115" height="140" rx="6" ry="6" fill="rgba(110,183,206,0.12)" stroke="rgba(110,183,206,0.4)" stroke-width="1"/>
  <g transform="translate(87.5, 90) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#6EB7CE">MYFORMAT</text>
  </g>

  <!-- MT/MX Translation module -->
  <rect x="153" y="20" width="115" height="140" rx="6" ry="6" fill="rgba(110,183,206,0.12)" stroke="rgba(110,183,206,0.4)" stroke-width="1"/>
  <g transform="translate(210.5, 90) rotate(-90)">
    <text x="0" y="-8" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#6EB7CE">MT/MX</text>
    <text x="0" y="10" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#6EB7CE">TRANSLATION</text>
  </g>

  <!-- Validation module -->
  <rect x="276" y="20" width="115" height="140" rx="6" ry="6" fill="rgba(110,183,206,0.12)" stroke="rgba(110,183,206,0.4)" stroke-width="1"/>
  <g transform="translate(333.5, 90) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#6EB7CE">VALIDATION</text>
  </g>

</svg>
